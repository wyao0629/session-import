      let locale = SI.detectLocale();
      const t = (key, params) => SI.getMessage(locale, key, params);
      const SEP = () => (locale === "zh-CN" ? "，" : ", ");
      const $ = (id) => document.getElementById(id);
      const state = {
        adapters: [],
        sources: new Map(), // source -> {found, count}
        sessions: [],
        activeSource: null,
        selected: new Set(),
        activeKey: null,
        activeSummary: null, previewToken: 0, importing: false,
      };

      // --- P1-U1: i18n chrome + locale resolution ---
      function paintChrome() {
        document.documentElement.lang = locale === "zh-CN" ? "zh-CN" : "en";
        document.title = t("app.title");
        const h1 = document.querySelector("h1");
        if (h1) h1.textContent = t("importer.heading");
        const hint = $("importer-hint");
        if (hint) hint.textContent = t("importer.hint");
        const scan = $("scan-btn");
        if (scan) scan.textContent = t("importer.scan");
        const filter = $("filter");
        if (filter) filter.placeholder = t("importer.filter.placeholder");
        const selAll = $("select-all");
        if (selAll) selAll.textContent = t("importer.selectAll");
        const clr = $("clear-all");
        if (clr) clr.textContent = t("importer.clearAll");
        const list = $("session-list");
        if (list) list.setAttribute("aria-label", t("importer.listbox.label"));
        const pe = $("preview-empty");
        if (pe) pe.textContent = t("importer.previewEmpty");
        const imp = $("import-btn");
        if (imp) imp.textContent = t("importer.import");
        if (typeof paintHubChrome === "function") paintHubChrome();
      }
      async function initLocale() {
        try {
          const hostLocale = await bridge.invoke("app.locale");
          if (hostLocale) locale = /^zh/i.test(String(hostLocale)) ? "zh-CN" : "en";
        } catch {
          // host SDK does not expose a locale — fall back to navigator
        }
        if (!locale) locale = SI.detectLocale();
        paintChrome();
      }
      // The work-panel has no native push channel; re-localize when the
      // panel regains focus as a proxy for "host locale changed".
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") relocalize();
      });
      async function relocalize() {
        await initLocale();
        if (state.sessions.length) {
          renderList();
          updateCount();
        }
      }

      const applyAppearance = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base = base === "light" || base === "dark"
          ? base
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      };
      bridge?.on("appearance:changed", applyAppearance);
      bridge?.invoke("app.getAppearance").then(applyAppearance).catch(() => applyAppearance(null));

      const fmtDate = (iso) => {
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? iso : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      };
      // P1-U2: escape helper removed — all dynamic content is now set via
      // textContent / DOM API, so no innerHTML interpolation is needed.
      const clear = (el) => { while (el && el.firstChild) el.removeChild(el.firstChild); };
      const setStatus = (text, kind = "") => {
        const el = $("status");
        el.textContent = text;
        el.className = kind;
      };
      const updateCount = () => {
        $("count").textContent = t("importer.count.selected", {
          selected: state.selected.size,
          total: visibleSessions().length,
        });
        const adapter = state.adapters.find((a) => a.source === state.activeSource);
        const native = adapter?.source === "pi" && canOpenPiNative() && !$("import-native").checked;
        $("pi-import-option").classList.toggle("hidden", adapter?.source !== "pi" || !canOpenPiNative());
        $("import-btn").textContent = native ? "在宿主中打开" : $("reimport-copy").checked ? "作为新副本再导入" : "导入（跳过重复）";
        $("import-btn").disabled = state.importing || !state.sessions.some(s => state.selected.has(s.externalId) && canImportToTarget(s));
      };

      async function scanSources() {
        const grid = $("source-grid");
        clear(grid);
        $("panes").classList.add("hidden");
        setStatus(t("importer.status.scanning"));
        state.sources = new Map();
        state.activeSource = null;
        state.selected.clear();
        state.previewToken++;

        const cards = [];
        for (const a of state.adapters) {
          const card = document.createElement("div");
          card.className = "source-card dim";
          const sname = document.createElement("div");
          sname.className = "sname";
          sname.textContent = a.label;
          if (a.custom) {
            const badge = document.createElement("span");
            badge.className = "sbadge";
            badge.textContent = t("importer.custom.badge");
            sname.appendChild(badge);
          }
          const scount = document.createElement("div");
          scount.className = "scount";
          scount.textContent = t("importer.source.detecting");
          card.append(sname, scount);
          card.addEventListener("click", () => openSource(a.source));
          grid.appendChild(card);
          cards.push({ adapter: a, card });
        }
        await Promise.all(
          cards.map(async ({ adapter, card }) => {
            let res;
            try {
              res = await bridge.invoke("import.scanSource", { source: adapter.source });
            } catch {
              res = { found: false, count: 0 };
            }
            state.sources.set(adapter.source, res);
            card.classList.remove("dim");
            if (res.found) {
              const sc = card.querySelector(".scount");
              paintCount(sc, res, adapter.source);
              sc.classList.add("ok");
            } else if (res.error && res.error.code === "TIMEOUT") {
              const sc = card.querySelector(".scount");
              sc.textContent = t("importer.source.scanTimeout");
              sc.classList.add("warn");
            } else if (res.error) {
              const sc = card.querySelector(".scount");
              sc.textContent = t("importer.source.scanFailed");
              sc.classList.add("warn");
            } else {
              card.querySelector(".scount").textContent = t("importer.source.notFound");
            }
          }),
        );
        setStatus(t("importer.status.scanDone"), "ok");
        // A partial result came from a cheap first pass; the plugin keeps
        // scanning and updates the count in place once it is complete.
        void refreshPartialSources(cards);
      }

      function paintCount(node, res, source) {
        if (!node) return;
        let base = t("importer.count.sessions", { count: res.count });
        if (res.archived > 0) base += ` · ${t("hub.view.archivedCount", { count: res.archived })}`;
        node.textContent = res.partial ? `${base} ${t("importer.count.scanningMore")}` : base;
        if (res.oversized > 0) {
          node.textContent += ` ${t("importer.count.oversized", { count: res.oversized })}`;
          node.classList.add("warn");
        }
        node.dataset.source = source;
      }

      async function refreshPartialSources(cards) {
        const partial = cards.filter(({ adapter }) => {
          const info = state.sources.get(adapter.source);
          return info?.partial === true;
        });
        if (!partial.length) return;
        // The plugin promotes partial scans in the background; poll a few
        // times so the card count settles without the user re-clicking.
        for (let attempt = 0; attempt < 10; attempt += 1) {
          await new Promise((r) => setTimeout(r, 1200));
          let anyPartial = false;
          await Promise.all(
            partial.map(async ({ adapter, card }) => {
              let res;
              try {
                res = await bridge.invoke("import.scanSource", { source: adapter.source });
              } catch {
                return;
              }
              state.sources.set(adapter.source, res);
              const sc = card.querySelector(".scount");
              paintCount(sc, res, adapter.source);
              if (res.partial) anyPartial = true;
            }),
          );
          if (!anyPartial) return;
        }
      }

      function openSource(source) {
        const info = state.sources.get(source);
        if (!info?.found) return;
        state.activeSource = source;
        state.selected.clear();
        state.previewToken++;
        $("import-native").checked = false;
        $("runtime-notice").textContent = targetNotice();
        state.activeKey = null; state.activeSummary = null;
        state.sessions = [];
        document.querySelectorAll(".source-card").forEach((card, i) => {
          card.classList.toggle("active", state.adapters[i]?.source === source);
        });
        $("panes").classList.remove("hidden");
        clear($("session-list"));
        renderPreviewEmpty();
        setStatus(t("importer.status.loadingList"));
        bridge
          .invoke("import.sessions", { source, includeArchived: true })
          .then((res) => {
            if (state.activeSource !== source) return;
            state.sessions = res.sessions;
            importView.mode = "active";
            paintViewSwitch();
            renderList();
            renderPreviewEmpty();
            updateCount();
            setStatus(t("importer.count.sessions", { count: visibleSessions().length }));
          })
          .catch((error) => setStatus(t("importer.status.loadFailed", { error }), "err"));
      }

      const matchesFilter = (s, q) =>
        !q ||
        s.title.toLowerCase().includes(q) ||
        (s.projectPath ?? "").toLowerCase().includes(q) ||
        String(s.externalId ?? "").toLowerCase().includes(q);

      const COLLAPSE_KEY = "session-import.collapsedProjects";
      let collapsedProjects = new Set();
      try {
        collapsedProjects = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"));
      } catch {
        collapsedProjects = new Set();
      }
      const saveCollapsed = () => {
        try {
          localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedProjects]));
        } catch {
          // persistence is best-effort; collapse still works in-session
        }
      };

      function renderList() {
        const q = $("filter").value.trim().toLowerCase();
        const list = $("session-list");
        clear(list);
        const visible = visibleSessions().filter((s) => matchesFilter(s, q));
        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "list-empty";
          empty.textContent = emptyViewText();
          list.appendChild(empty);
          return;
        }
        const groups = new Map();
        for (const s of visible) {
          const key = s.projectPath ?? "";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(s);
        }
        for (const [projectPath, sessions] of groups) {
          const groupKey = projectPath || "__none__";
          const isCollapsed = collapsedProjects.has(groupKey);

          const group = document.createElement("div");
          group.className = "group " + (isCollapsed ? "collapsed" : "expanded");

          const head = document.createElement("div");
          head.className = "group-head";
          head.setAttribute("role", "button");
          head.setAttribute("tabindex", "0");
          head.setAttribute("aria-expanded", String(!isCollapsed));
          head.title = projectPath || "";
          const name = projectPath
            ? projectPath.replace(/[\\/]+$/, "").split(/[\\/]/).pop()
            : t("importer.group.noProject");
          const chev = document.createElement("span");
          chev.className = "chev";
          chev.textContent = "▶";
          const gname = document.createElement("span");
          gname.className = "gname";
          gname.textContent = name;
          const gcount = document.createElement("span");
          gcount.className = "gcount";
          gcount.textContent = t("importer.count.sessions", { count: sessions.length });
          head.append(chev, gname, gcount);

          const selectable = sessions.filter(canImportToTarget);
          const allSelected = selectable.length > 0 && selectable.every((s) => state.selected.has(s.externalId));
          const btn = document.createElement("button");
          btn.textContent = allSelected ? t("importer.group.deselectAll") : t("importer.group.selectAll");
          // Selecting a whole project must not toggle the accordion.
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            for (const s of selectable) {
              allSelected ? state.selected.delete(s.externalId) : state.selected.add(s.externalId);
            }
            renderList();
            updateCount();
          });
          head.appendChild(btn);

          const toggleCollapse = () => {
            const nowCollapsed = !group.classList.contains("collapsed");
            group.classList.toggle("collapsed", nowCollapsed);
            group.classList.toggle("expanded", !nowCollapsed);
            head.setAttribute("aria-expanded", String(!nowCollapsed));
            nowCollapsed ? collapsedProjects.add(groupKey) : collapsedProjects.delete(groupKey);
            saveCollapsed();
          };
          head.addEventListener("click", toggleCollapse);
          head.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleCollapse();
            }
          });

          const body = document.createElement("div");
          body.className = "group-body";
          const inner = document.createElement("div");
          inner.className = "group-body-inner";

          for (const s of sessions) {
            const row = document.createElement("div");
            row.className = "session-row" + (s.externalId === state.activeKey ? " active" : "");
            row.setAttribute("role", "option");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = state.selected.has(s.externalId);
            cb.disabled = !canImportToTarget(s);
            cb.addEventListener("click", (e) => e.stopPropagation());
            cb.addEventListener("change", () => {
              cb.checked ? state.selected.add(s.externalId) : state.selected.delete(s.externalId);
              updateCount();
            });
            const text = document.createElement("div");
            const titleEl = document.createElement("div");
            titleEl.className = "title";
            titleEl.textContent = s.title;
            if (s.imported && isPiDesktopTarget() && !destinationState.native) {
              const badge = document.createElement("span");
              badge.className = "sbadge";
              badge.textContent = t("hub.imported");
              titleEl.append(" ", badge);
            }
            const metaEl = document.createElement("div");
            metaEl.className = "meta";
            const mDate = document.createElement("span");
            mDate.textContent = fmtDate(s.updatedAt);
            const mDot = document.createElement("span");
            mDot.textContent = "·";
            const mCount = document.createElement("span");
            mCount.textContent = s.messageCount == null ? "" : t("importer.preview.Nmessages", { count: s.messageCount });
            metaEl.append(mDate);
            if (s.messageCount != null) metaEl.append(mDot, mCount);
            if (s.childCount) metaEl.append(document.createTextNode(` · 子代理 ${s.childCount}`));
            if (s.nativeInHost) metaEl.append(document.createTextNode(" · 宿主原生支持"));
            if (!canImportToTarget(s)) metaEl.append(document.createTextNode(" · 仅预览"));
            text.append(titleEl, metaEl);
            row.append(cb, text);
            row.addEventListener("click", () => selectSession(s));
            inner.appendChild(row);
          }

          body.appendChild(inner);
          group.append(head, body);
          list.appendChild(group);
        }
      }

      function renderPreviewEmpty() {
        $("preview-empty").classList.remove("hidden");
        $("preview-head").classList.add("hidden");
        $("messages").classList.add("hidden");
        clear($("messages"));
      }

      function importOptions() {
        return { withThinking: $("with-thinking").checked, subagentSummary: $("subagent-summary").checked,
          mode: $("reimport-copy").checked ? "new" : "skip", importNative: $("import-native").checked };
      }

      async function selectSession(summary) {
        const token = ++state.previewToken;
        state.activeKey = summary.externalId;
        state.activeSummary = summary;
        renderList();
        $("preview-empty").classList.add("hidden");
        $("preview-head").classList.remove("hidden");
        $("messages").classList.remove("hidden");
        clear($("messages"));
        $("pv-title").textContent = summary.fullTitle ?? summary.title;
        $("pv-meta").textContent = [summary.harness, summary.projectPath ?? summary.workspacePath ?? "", fmtDate(summary.updatedAt)].filter(Boolean).join(" · ");
        setStatus(t("importer.status.loadingList"));
        const box = $("messages");
        const options = importOptions();
        try {
          await appendSessionPreview(summary, box, options, token);
          if (token !== state.previewToken) return;
          setStatus("预览已加载；可展开父会话下的子代理，或用“继续读取”查看全文。");
        } catch (error) { if (token === state.previewToken) setStatus(String(error.message ?? error), "err"); }
      }

      async function appendSessionPreview(summary, box, options, token) {
        const pre = document.createElement("pre");
        pre.className = "d-pre";
        box.appendChild(pre);
        const more = document.createElement("button");
        more.textContent = "继续读取";
        let offset = 0, first = true;
        const load = async () => {
          more.disabled = true;
          try {
            const r = await bridge.invoke("hub.read", { harness: summary.harness ?? summary.source, ref: summary.key ?? summary.sessionId ?? summary.externalId,
              withThinking: options.withThinking, includeSubagents: false, toolDetail: "full", offset, maxChars: 20000 });
            if (token !== state.previewToken) return;
            pre.textContent += r.content; offset = r.nextOffset; more.hidden = offset == null;
            if (first) {
              first = false;
              for (const child of r.children.filter((c) => c.parentKey ? c.parentKey === r.session.key : c.parentSessionId === r.sessionId)) {
                const details = document.createElement("details"); details.className = "child-preview";
                const title = document.createElement("summary"); title.textContent = `子代理：${child.title}`; details.appendChild(title);
                const body = document.createElement("div"); details.appendChild(body);
                let loaded = false;
                details.addEventListener("toggle", async () => {
                  if (!details.open || loaded) return; loaded = true;
                  try { await appendSessionPreview(child, body, options, token); }
                  catch (error) { body.append(document.createTextNode(String(error.message ?? error))); }
                });
                if (canImportToTarget(child)) {
                  const button = document.createElement("button"); button.textContent = "单独导入此子会话";
                  button.addEventListener("click", async () => { button.disabled = true; try { await submitImport([child], child.harness); } finally { button.disabled = false; } });
                  body.appendChild(button);
                }
                box.appendChild(details);
              }
            }
          } finally { more.disabled = false; }
        };
        more.addEventListener("click", () => load().catch((e) => setStatus(String(e.message ?? e), "err")));
        box.appendChild(more);
        await load();
      }

      async function submitImport(items, source) {
        state.importing = true; updateCount();
        setStatus(t("importer.importing", { count: items.length }));
        try {
          const r = await bridge.invoke("import.commit", { source, items, ...importDestination(), ...importOptions() });
          const parts = [`已导入 ${r.imported}`, `跳过 ${r.skipped}`];
          if (r.unreadable) parts.push(`不可读 ${r.unreadable}`);
          if (r.failed?.length) parts.push(`失败 ${r.failed.reduce((n, f) => n + (f.count ?? 1), 0)}：${r.failed[0].error}`);
          if (r.truncated) parts.push(`有截断 ${r.truncated}`);
          if (r.warnings?.length) parts.push(`提示 ${r.warnings.length}：${r.warnings[0].error}`);
          $("runtime-notice").textContent = r.notice;
          setStatus(parts.join("；"), !r.ok ? "err" : r.warnings?.length || r.truncated ? "warn" : "ok");
          if (state.activeSource) {
            const list = await bridge.invoke("import.sessions", { source: state.activeSource, includeArchived: true });
            state.sessions = list.sessions; renderList();
          }
        } catch (error) { setStatus(String(error.message ?? error), "err"); }
        finally { state.importing = false; updateCount(); }
      }

      async function importSelected() {
        const items = state.sessions.filter((s) => canImportToTarget(s) && state.selected.has(s.externalId));
        if (!items.length || state.importing) return;
        if (items[0].nativeInHost && canOpenPiNative() && !$("import-native").checked) {
          if (items.length !== 1) { setStatus("原生打开请仅选择一个 Pi 会话", "warn"); return; }
          state.importing = true; updateCount();
          try { await bridge.invoke("hub.openNative", { harness: "pi", ref: items[0].key }); setStatus("已在宿主打开 Pi 原生会话", "ok"); }
          catch (error) { setStatus(String(error.message ?? error), "err"); }
          finally { state.importing = false; updateCount(); }
          return;
        }
        await submitImport(items, state.activeSource);
      }
      for (const id of ["with-thinking", "subagent-summary", "reimport-copy", "import-native"]) {
        $(id).addEventListener("change", () => { updateCount(); if (id === "with-thinking" && state.activeSummary) selectSession(state.activeSummary); });
      }

      $("import-btn").addEventListener("click", importSelected);
      // 目标工作区由导入位置选择传给宿主接口。
      $("filter").addEventListener("input", renderList);
      $("select-all").addEventListener("click", () => {
        const q = $("filter").value.trim().toLowerCase();
        for (const s of visibleSessions()) if (canImportToTarget(s) && matchesFilter(s, q)) state.selected.add(s.externalId);
        renderList();
        updateCount();
      });
      $("clear-all").addEventListener("click", () => {
        state.selected.clear();
        renderList();
        updateCount();
      });

      async function loadCustomSourcesInfo() {
        try {
          const info = await bridge.invoke("import.customSources");
          renderCustomSources(info);
          return info;
        } catch {
          // Host without the channel (older build) -> hide the panel entirely.
          const panel = $("custom-sources");
          if (panel) panel.hidden = true;
          return null;
        }
      }

      function renderCustomSources(info) {
        const panel = $("custom-sources");
        if (!panel || !info) return;
        $("cs-title").textContent = t("importer.custom.title");
        $("cs-reload").textContent = t("importer.custom.reload");
        $("cs-hint").textContent = t("importer.custom.hint", {
          path: info.configPath || "docs/session-import-sources.json",
        });
        $("cs-count").textContent = t("importer.custom.count", { count: info.count || 0 });
        $("cs-drivers").textContent =
          Array.isArray(info.drivers) && info.drivers.length
            ? t("importer.custom.drivers", { drivers: info.drivers.join(", ") })
            : "";
        const errs = Array.isArray(info.errors) ? info.errors : [];
        const errNode = $("cs-errors");
        errNode.textContent = errs.length
          ? t("importer.custom.errors", { errors: errs.join("; ") })
          : "";
        errNode.style.display = errs.length ? "" : "none";
      }

      (async () => {
        await initLocale();
        await initHubSync();
        initAll();
        initImportView();
        await initDestination();
        state.adapters = await bridge.invoke("import.adapters");
        await loadCustomSourcesInfo();
        void scanSources();

        $("cs-reload").addEventListener("click", async () => {
          try {
            const info = await bridge.invoke("import.reloadCustomSources");
            state.adapters = await bridge.invoke("import.adapters");
            renderCustomSources(info);
            // Re-scan so a newly added source shows up immediately.
            await scanSources();
            setStatus(t("importer.custom.reloaded"), "ok");
          } catch (err) {
            setStatus(
              t("importer.custom.reloadFailed", { error: String((err && err.message) || err) }),
              "err",
            );
          }
        });
      })();
    </script>
  </body>
</html>
